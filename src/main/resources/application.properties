# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App Configuration
app.email.from=${EMAIL_FROM:noreply@techrestore.com}
app.base-url=${BASE_URL:http://localhost:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-that-should-be-very-long-and-secure}

# Database Configuration (placeholder - update with actual database settings)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/techrestore}
spring.datasource.username=${DATABASE_USERNAME:techrestore}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect